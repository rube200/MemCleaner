name: Build

on:
  push:
    branches: [master]
    tags: ['v?[0-9]+.[0-9]+.[0-9]+']

  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish native AOT exe
        run: dotnet publish src/MemCleaner/MemCleaner.csproj -c Release -r win-x64 -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: MemCleaner
          path: publish/MemCleaner.exe
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 7 }}

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download exe
        uses: actions/download-artifact@v8
        with:
          name: MemCleaner

      - name: Attest exe
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: MemCleaner.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tag=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')
          notes=""
          if [ -n "$tag" ]; then
            notes=$(gh api "repos/$REPO/git/tags/$tag" --jq '.message')
          fi
          gh release create "$TAG" MemCleaner.exe --repo "$REPO" --title "$TAG" --notes "$notes" --generate-notes
